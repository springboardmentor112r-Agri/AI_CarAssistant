<!DOCTYPE html>
<html>
<head>
<title>DealGuard AI</title>

<style>
body{
  font-family:Segoe UI;
  background:#0b1220;
  color:white;
  margin:0;
}

.nav{
  padding:15px;
  background:#020617;
  font-size:20px;
}

.tabs{
  display:flex;
  gap:10px;
  padding:20px;
}

.tab{
  padding:10px 20px;
  background:#1e293b;
  cursor:pointer;
  border-radius:8px;
}

.active{
  background:#2563eb;
}

.card{
  background:#111827;
  padding:20px;
  margin:20px;
  border-radius:10px;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

.bar{
  background:#1e293b;
  border-radius:10px;
}

.fill{
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.panel{display:none;}
</style>
</head>

<body>

<div class="nav">DealGuard AI</div>

<div class="tabs">
  <div class="tab active" onclick="show('a',this)">Analyze</div>
  <div class="tab" onclick="show('c',this)">Compare</div>
  <div class="tab" onclick="show('chat',this)">Chat</div>
</div>

<div id="a" class="panel">
<div class="card">
<input type="file" id="f">
<button onclick="analyze()">Analyze</button>
</div>
<div class="card" id="r"></div>
</div>

<div id="c" class="panel">
<div class="card">
<input type="file" id="f1">
<input type="file" id="f2">
<button onclick="compare()">Compare</button>
</div>
<div class="card" id="rc"></div>
</div>

<div id="chat" class="panel">
<div class="card">
<input id="q">
<button onclick="chat()">Ask</button>
<div id="res"></div>
</div>
</div>

<script>

function show(id,el){
document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
document.getElementById(id).style.display="block";
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");
}

show("a",document.querySelector(".tab"));

async function analyze(){
let fd=new FormData();
fd.append("file",document.getElementById("f").files[0]);

document.getElementById("r").innerHTML="Processing...";

let res=await fetch("http://127.0.0.1:8000/analyze/",{method:"POST",body:fd});
let d=await res.json();

let color=d["Risk Level"]=="High"?"red":d["Risk Level"]=="Moderate"?"orange":"green";

document.getElementById("r").innerHTML=`
APR: ${d["APR"]}<br>
Score: ${d["Contract Quality Score"]}<br>
Risk: <span style="color:${color}">${d["Risk Level"]}</span>

<div class="bar">
<div class="fill" style="width:${d["Risk %"]}%;background:${color}">
${d["Risk %"]}%
</div>
</div>

Summary: ${d["Summary"]}<br>
Suggestions: ${d["Suggestions"]}<br>
`;
}

async function compare(){
let fd=new FormData();
fd.append("file1",document.getElementById("f1").files[0]);
fd.append("file2",document.getElementById("f2").files[0]);

let res=await fetch("http://127.0.0.1:8000/compare/",{method:"POST",body:fd});
let d=await res.json();

document.getElementById("rc").innerHTML=`
Better: ${d["Better Contract"]}<br>
Reason: ${d["Reason"]}
`;
}

async function chat(){
let q=document.getElementById("q").value;
let res=await fetch(`http://127.0.0.1:8000/chat/?query=${q}`);
let d=await res.json();

document.getElementById("res").innerHTML=d["response"];
}

</script>

</body>
</html>
