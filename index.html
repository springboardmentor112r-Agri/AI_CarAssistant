<!DOCTYPE html>
<html>
<head>
<title>Car Lease AI Platform</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", sans-serif;
  background: #0b1220;
  color: #e2e8f0;
}

.navbar {
  height: 60px;
  background: #020617;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  border-bottom: 1px solid #1e293b;
}

.logo {
  font-size: 20px;
  font-weight: 600;
}

.container {
  display: flex;
}

.sidebar {
  width: 220px;
  height: calc(100vh - 60px);
  background: #020617;
  padding-top: 20px;
}

.sidebar div {
  padding: 15px 20px;
  cursor: pointer;
  color: #94a3b8;
}

.sidebar div:hover {
  background: #1e293b;
  color: white;
}


.main {
  flex: 1;
  padding: 30px;
}

.card {
  background: #111827;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  border: 1px solid #1f2937;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.box {
  background: #020617;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #1e293b;
}


button {
  width: 100%;
  padding: 10px;
  background: #2563eb;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
  font-weight: 500;
}

button:hover {
  background: #1d4ed8;
}

input {
  width: 100%;
  padding: 8px;
  margin-bottom: 10px;
  border-radius: 6px;
  border: 1px solid #1e293b;
  background: #020617;
  color: white;
}

.panel {
  display: none;
}
</style>

</head>

<body>

<div class="navbar">
  <div class="logo">Car Lease AI</div>
</div>

<div class="container">

<div class="sidebar">
  <div onclick="show('analyze')">Analyze Contract</div>
  <div onclick="show('compare')">Compare Contracts</div>
  <div onclick="show('chat')">Assistant</div>
</div>

<div class="main">

<div id="analyze" class="panel">
  <div class="card">
    <h3>Upload Contract</h3>
    <input type="file" id="file1">
    <button onclick="analyze()">Analyze</button>
  </div>

  <div class="card">
    <h3>Analysis Report</h3>
    <div id="result1"></div>
  </div>
</div>

<div id="compare" class="panel">
  <div class="card">
    <h3>Upload Contracts</h3>
    <input type="file" id="file2">
    <input type="file" id="file3">
    <button onclick="compare()">Compare</button>
  </div>

  <div class="card">
    <div id="result2"></div>
  </div>
</div>

<!-- CHAT -->
<div id="chat" class="panel">
  <div class="card">
    <h3>Assistant</h3>
    <input type="text" id="query">
    <button onclick="chat()">Ask</button>
    <div id="result3"></div>
  </div>
</div>

</div>
</div>

<script>

// SWITCH
function show(id){
  document.querySelectorAll(".panel").forEach(p => p.style.display="none");
  document.getElementById(id).style.display="block";
}

show("analyze");


async function analyze(){
  const file = document.getElementById("file1").files[0];
  const fd = new FormData();
  fd.append("file", file);

  const res = await fetch("http://127.0.0.1:8000/analyze/", {
    method: "POST",
    body: fd
  });

  const d = await res.json();

  document.getElementById("result1").innerHTML = `
    <div class="grid">
      <div class="box">APR: ${d["APR"]}</div>
      <div class="box">Payment: ${d["Payment"]}</div>
      <div class="box">Duration: ${d["Duration"]}</div>
      <div class="box">VIN: ${d["VIN"]}</div>

      <div class="box">Score: ${d["Contract Quality Score"]}</div>
      <div class="box">Risk: ${d["Risk Level"]}</div>
      <div class="box">Financial Risk: ${d["Financial Risk"]}</div>
      <div class="box">Legal Risk: ${d["Legal Risk"]}</div>

      <div class="box">Verdict: ${d["Final Verdict"]}</div>
      <div class="box">Key Issue: ${d["Key Issue"]}</div>
    </div>

    <p>Reason: ${d["Why This Result"]}</p>
    <p>Suggestions: ${d["Suggestions"]}</p>
    <p>Decision: ${d["Decision Guide"]}</p>
  `;
}


async function compare(){
  const f1 = document.getElementById("file2").files[0];
  const f2 = document.getElementById("file3").files[0];

  const fd = new FormData();
  fd.append("file1", f1);
  fd.append("file2", f2);

  const res = await fetch("http://127.0.0.1:8000/compare/", {
    method: "POST",
    body: fd
  });

  const d = await res.json();

  document.getElementById("result2").innerHTML = `
    <p>Contract 1 APR: ${d["Contract 1 APR"]}</p>
    <p>Contract 2 APR: ${d["Contract 2 APR"]}</p>
    <p>Better: ${d["Better Contract"]}</p>
  `;
}


async function chat(){
  const q = document.getElementById("query").value;

  const res = await fetch(`http://127.0.0.1:8000/chat/?query=${q}`);
  const d = await res.json();

  document.getElementById("result3").innerHTML = `<p>${d["response"]}</p>`;
}

</script>

</body>
</html>
