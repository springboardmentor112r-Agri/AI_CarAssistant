<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoNegotiator - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #20232b;
            --border-color: #2b2e36;
            --text-primary: #ffffff;
            --text-secondary: #949ba4;
            --accent: #4ade80;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1c2029 0%, transparent 60%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 24px;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .brand p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 6px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: #16181d;
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 15px;
            font-family: var(--font-family);
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4ade80;
        }

        .login-btn {
            width: 100%;
            background: white;
            color: black;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            font-family: var(--font-family);
            margin-top: 8px;
            transition: all 0.2s;
        }

        .login-btn:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .hint {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .hint span {
            display: inline-block;
            background: #16181d;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            margin: 4px;
            font-family: monospace;
            font-size: 12px;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand">
            <div class="brand-icon">🚗</div>
            <h1>AutoNegotiator</h1>
            <p>AI-powered car negotiation assistant</p>
        </div>

        <div class="card">
            <div class="error-msg" id="errorMsg">
                Incorrect username or password. Please try again.
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
            </div>

            <button class="login-btn" id="loginBtn" onclick="handleLogin()">Sign In</button>
        </div>

        <div class="hint">
            Demo credentials: <span>admin</span> / <span>admin123</span>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        // If already logged in, redirect to main app
        if (sessionStorage.getItem('auth_token')) {
            window.location.href = 'index.html';
        }

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!username || !password) {
                errorMsg.textContent = 'Please enter both username and password.';
                errorMsg.classList.add('show');
                return;
            }

            // Show loading state
            btn.textContent = 'Signing in...';
            btn.disabled = true;
            errorMsg.classList.remove('show');

            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Store token and username in sessionStorage
                    sessionStorage.setItem('auth_token', data.token);
                    sessionStorage.setItem('username', data.username);
                    // Redirect to main app
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = data.error || 'Incorrect username or password.';
                    errorMsg.classList.add('show');
                    btn.textContent = 'Sign In';
                    btn.disabled = false;
                }

            } catch (err) {
                errorMsg.textContent = 'Cannot connect to server. Make sure backend is running.';
                errorMsg.classList.add('show');
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
