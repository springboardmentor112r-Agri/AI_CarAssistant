<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Contract Analyzer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #2b2a3f, #1a1a2e);
  color: white;
}

/* HEADER */
.header {
  text-align: center;
  padding: 20px;
  font-size: 22px;
  font-weight: 600;
}

/* UPLOAD */
.upload-bar {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 15px;
}

input[type="file"] {
  background: rgba(255,255,255,0.1);
  padding: 8px;
  border-radius: 8px;
  color: white;
}

button {
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(45deg, #00c6ff, #0072ff);
  color: white;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 0 10px rgba(0,198,255,0.5);
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 0 20px rgba(0,198,255,0.9);
}

/* MAIN LAYOUT */
.main {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 25px;
  padding: 25px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.06);
  border-radius: 18px;
  padding: 25px;
  backdrop-filter: blur(18px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  animation: fadeIn 0.6s ease;
}

/* METRICS GRID */
.metrics-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
}

.metric-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.08);
  padding: 15px;
  border-radius: 14px;
  transition: 0.3s;
  box-shadow: 0 0 10px rgba(0,198,255,0.15);
}

.metric-card:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.15);
}

.icon {
  font-size: 22px;
}

.value {
  font-size: 18px;
  font-weight: 600;
  margin: 0;
}

/* RISKS */
ul {
  padding-left: 18px;
}

li {
  margin-bottom: 8px;
}

/* CHAT */
.chat-box {
  height: 320px;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

/* CHAT BUBBLES */
.chat-msg {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 14px;
  margin-bottom: 10px;
  animation: fadeIn 0.3s ease;
}

.user {
  background: linear-gradient(45deg, #00c6ff, #0072ff);
  align-self: flex-end;
}

.bot {
  background: rgba(255,255,255,0.1);
  align-self: flex-start;
}

/* CHAT INPUT */
.chat-input {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

/* ANIMATION */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="header">🚗 AI Contract Intelligence</div>

<div class="upload-bar">
  <input type="file" id="fileInput">
  <button onclick="uploadFile()">Analyze</button>
</div>

<div class="main">

  <!-- LEFT PANEL -->
  <div class="card">

    <div class="metrics-grid">

      <div class="metric-card">
        <div class="icon">💰</div>
        <div>
          <p class="value" id="payment"></p>
          <span>Monthly Payment</span>
        </div>
      </div>

      <div class="metric-card">
        <div class="icon">⏳</div>
        <div>
          <p class="value" id="term"></p>
          <span>Lease Term</span>
        </div>
      </div>

      <div class="metric-card">
        <div class="icon">⭐</div>
        <div>
          <p class="value" id="score"></p>
          <span>Fairness Score</span>
        </div>
      </div>

      <div class="metric-card">
        <div class="icon">🚦</div>
        <div>
          <p class="value" id="riskLevel"></p>
          <span>Risk Level</span>
        </div>
      </div>

    </div>

    <h3>⚠️ Risks</h3>
    <ul id="risks"></ul>

    <h3>🧾 Summary</h3>
    <p id="summary"></p>

  </div>

  <!-- RIGHT PANEL -->
  <div class="card">

    <h3>🤖 AI Assistant</h3>

    <div id="chatBox" class="chat-box"></div>

    <div class="chat-input">
      <input type="text" id="userQuestion" placeholder="Ask about this contract..." />
      <button onclick="askQuestion()">→</button>
    </div>

  </div>

</div>

<script>

let globalData = null;

async function uploadFile() {
  const file = document.getElementById("fileInput").files[0];

  if (!file) {
    alert("Please upload a file first");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  const res = await fetch("http://localhost:8000/analyze", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  globalData = data;

  const a = data.analysis;
  const e = data.evaluation;

  document.getElementById("payment").innerText = a.monthly_payment;
  document.getElementById("term").innerText = a.lease_term;
  document.getElementById("score").innerText = e.fairness_score + "/100";
  document.getElementById("summary").innerText = e.summary;

  const rl = document.getElementById("riskLevel");
  rl.innerText = e.risk_level;

  if (e.risk_level === "High") rl.style.color = "red";
  else if (e.risk_level === "Medium") rl.style.color = "orange";
  else rl.style.color = "lightgreen";

  const list = document.getElementById("risks");
  list.innerHTML = "";
  a.risks.forEach(r => {
    const li = document.createElement("li");
    li.innerText = "🔴 " + r;
    list.appendChild(li);
  });
}

async function askQuestion() {
  const q = document.getElementById("userQuestion").value;

  if (!q || !globalData) return;

  const res = await fetch("http://localhost:8000/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({context: globalData, message: q})
  });

  const data = await res.json();

  const chatBox = document.getElementById("chatBox");

  chatBox.innerHTML += `<div class="chat-msg user">${q}</div>`;
  chatBox.innerHTML += `<div class="chat-msg bot">${data.reply}</div>`;

  chatBox.scrollTop = chatBox.scrollHeight;

  document.getElementById("userQuestion").value = "";
}

</script>

</body>
</html>
